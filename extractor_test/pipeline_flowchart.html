<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法律文书解析提取流水线</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#f5f5f5; color:#2d3142; font-family:'Geist',sans-serif; }
  .page { max-width:820px; margin:0 auto; padding:48px 24px; }
  .eyebrow { font-family:'Geist Mono',monospace; font-size:8px; letter-spacing:0.14em; text-transform:uppercase; color:#7a8399; margin:0 0 8px; }
  h1 { font-family:'Instrument Serif',serif; font-weight:400; font-size:28px; margin:0 0 8px; }
  .subtitle { color:#4f5d75; font-size:16px; margin:0 0 32px; }
  svg { width:100%; height:auto; display:block; }
  .footer { margin-top:32px; padding-top:16px; border-top:1px solid rgba(45,49,66,0.12); font-family:'Geist Mono',monospace; font-size:8px; color:#7a8399; }
</style>
</head>
<body>
<div class="page">
  <p class="eyebrow">Extractor Pipeline</p>
  <h1>法律文书解析提取流水线</h1>
  <p class="subtitle">PDF → 判型 → 多 voter 提取（溯源兜底重生成）→ 投票输出</p>

  <svg viewBox="0 0 760 976" role="img" aria-labelledby="pipeline-title pipeline-desc">
    <title id="pipeline-title">法律文书解析提取流水线</title>
    <desc id="pipeline-desc">流程图展示 PDF 经 MinerU OCR、判型、解析校验、多 voter 提取（含溯源重生成）和多数投票包装后输出结构化字段的完整流水线。</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>
    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- 连接线（先画，置于节点之下） -->
    <line x1="380" y1="96" x2="380" y2="120" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="380" y1="200" x2="380" y2="224" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="380" y1="304" x2="380" y2="328" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="380" y1="440" x2="380" y2="464" stroke="#eb6c36" stroke-width="1" marker-end="url(#arrow-accent)"/>
    <line x1="500" y1="384" x2="548" y2="384" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="380" y1="544" x2="380" y2="568" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="380" y1="648" x2="380" y2="672" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="380" y1="752" x2="380" y2="776" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M500,600 H544 Q552,600 552,608 V616 Q552,624 544,624 H500" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- 箭头标签（带纸色遮罩，与线保持 8px 间距） -->
    <rect x="356" y="444" width="16" height="12" rx="2" fill="#f5f5f5"/>
    <text x="364" y="452" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">是</text>
    <rect x="516" y="364" width="16" height="12" rx="2" fill="#f5f5f5"/>
    <text x="524" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">否</text>
    <rect x="560" y="606" width="48" height="12" rx="2" fill="#f5f5f5"/>
    <text x="584" y="616" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">VOTER&lt;N</text>

    <!-- 开始：PDF 文书 -->
    <rect x="260" y="16" width="240" height="80" rx="40" fill="#f5f5f5"/>
    <rect x="260" y="16" width="240" height="80" rx="40" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="380" y="58" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">开始</text>
    <text x="380" y="74" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PDF 文书</text>

    <!-- OCR -->
    <rect x="260" y="120" width="240" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="260" y="120" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="380" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MinerU OCR 解析</text>
    <text x="380" y="178" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">BASE_URL /tasks</text>

    <!-- 判型 -->
    <rect x="260" y="224" width="240" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="260" y="224" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="380" y="266" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">classify_node 判型</text>
    <text x="380" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">file-type-classification</text>

    <!-- 决策：是否需解析 -->
    <path d="M380,328 L500,384 L380,440 L260,384 Z" fill="#f5f5f5"/>
    <path d="M380,328 L500,384 L380,440 L260,384 Z" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="380" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">需解析且命中 skill？</text>
    <text x="380" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">是否需解析 &amp; 类型匹配</text>

    <!-- 解析校验 -->
    <rect x="260" y="464" width="240" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="260" y="464" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="380" y="506" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">parse_check_node</text>
    <text x="380" y="522" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">skill_for_doc_type 映射</text>

    <!-- 提取（单 voter，含重生成） -->
    <rect x="260" y="568" width="240" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="260" y="568" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="380" y="610" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">extract_node（单 voter）</text>
    <text x="380" y="626" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">提取 → 溯源校验 → 重生成≤MAX_REGEN</text>
    <text x="380" y="642" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">非JSON重试一次；无有效字段不计票</text>

    <!-- 投票与输出包装 -->
    <rect x="260" y="672" width="240" height="80" rx="6" fill="#f5f5f5"/>
    <rect x="260" y="672" width="240" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="380" y="714" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">collect_node 投票+包装</text>
    <text x="380" y="730" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">majority_vote / 金额还原 / 置信度</text>

    <!-- 结束：输出 -->
    <rect x="260" y="776" width="240" height="80" rx="40" fill="#f5f5f5"/>
    <rect x="260" y="776" width="240" height="80" rx="40" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="380" y="818" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">结束（输出）</text>
    <text x="380" y="834" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">{字段:{value,置信度},提取说明,文书类型}</text>

    <!-- 结束：不解析 -->
    <rect x="548" y="344" width="168" height="80" rx="40" fill="#f5f5f5"/>
    <rect x="548" y="344" width="168" height="80" rx="40" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
    <text x="632" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">结束（不解析）</text>
    <text x="632" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">仅归档</text>

    <!-- 图例（底部横向条） -->
    <line x1="40" y1="904" x2="720" y2="904" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="40" y="928" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">图例</text>
    <rect x="116" y="916" width="48" height="24" rx="12" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="176" y="932" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">开始 / 结束</text>
    <rect x="272" y="920" width="40" height="16" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="328" y="932" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">步骤</text>
    <path d="M332,920 L352,928 L332,936 L312,928 Z" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="368" y="932" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">决策</text>
    <line x1="448" y1="928" x2="492" y2="928" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="508" y="932" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">循环</text>
  </svg>

  <p class="footer">自包含 HTML · diagram-design · 默认皮肤</p>
</div>
</body>
</html>
